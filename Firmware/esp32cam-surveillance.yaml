##############################################################################
# Surveillance Camera  ·  AI-Thinker ESP32-CAM (ESP32 + OV2640)
# Integración: Home Assistant (API nativa ESPHome, auto-discovery)
#
# Primer flasheo por USB:  esphome run esp32cam-surveillance.yaml
#   (con la placa base ESP32-CAM-MB; auto-reset, no suele hacer falta modo boot)
# Actualizaciones posteriores: OTA (por WiFi, automático)
##############################################################################

substitutions:
  name: esp32cam
  friendly_name: "Cámara Vigilancia"

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  # Añade los últimos 3 bytes de la MAC al nombre -> hostname único por placa.
  # Así se puede flashear este MISMO YAML en todas las cámaras sin colisiones:
  #   esp32cam-a1b2c3, esp32cam-9f4d20, ...
  name_add_mac_suffix: true

esp32:
  board: esp32dev
  flash_size: 4MB
  framework:
    type: esp-idf

# La AI-Thinker lleva ESP32-WROVER con 4MB de PSRAM (modo quad).
psram:
  mode: quad
  speed: 80MHz

# --- Logs -------------------------------------------------------------------
logger:
  level: INFO

# --- API nativa: esto es lo que hace que HA la descubra sola ---------------
api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  # Si se cae el WiFi, levanta un AP propio para poder reconfigurar.
  ap:
    ssid: "${name} Fallback"
    password: !secret ap_password

captive_portal:

##############################################################################
# CÁMARA
# Pinout estándar de la AI-Thinker ESP32-CAM (OV2640).
##############################################################################
esp32_camera:
  name: Cámara
  external_clock:
    pin: GPIO0
    frequency: 20MHz
  i2c_pins:
    sda: GPIO26
    scl: GPIO27
  data_pins: [GPIO5, GPIO18, GPIO19, GPIO21, GPIO36, GPIO39, GPIO34, GPIO35]
  vsync_pin: GPIO25
  href_pin: GPIO23
  pixel_clock_pin: GPIO22
  power_down_pin: GPIO32

  # Ajustes priorizando FLUIDEZ (más fps) sobre resolución.
  resolution: 640x480        # VGA. Menos píxeles = más fps. Sube a 800x600 si quieres más detalle.
  jpeg_quality: 12           # 10-63; MÁS ALTO = más compresión = frames pequeños = más fps.
  max_framerate: 15 fps      # el OV2640 a VGA aguanta ~10-15 fps reales.
  idle_framerate: 0.2 fps    # cuando nadie mira, baja el ritmo (ahorra CPU/calor).
  vertical_flip: false
  horizontal_mirror: false

# Servidor web en la propia placa: stream MJPEG + snapshot.
# Útil para Frigate/motionEye o para incrustar la URL en otra tarjeta.
#   Stream:   http://<ip-de-la-camara>:8080
#   Snapshot: http://<ip-de-la-camara>:8081
esp32_camera_web_server:
  - port: 8080
    mode: stream
  - port: 8081
    mode: snapshot

##############################################################################
# LED de flash (LED blanco potente en GPIO4) — controlable/regulable desde HA
# El LED rojo de estado (GPIO33, lógica invertida) parpadea según la conexión.
##############################################################################
output:
  - platform: ledc
    pin: GPIO4
    channel: 2
    id: flash_output

light:
  - platform: monochromatic
    name: Flash
    output: flash_output
    id: flash_light

status_led:
  pin:
    number: GPIO33
    inverted: true

##############################################################################
# SENSORES DEL SISTEMA
##############################################################################
sensor:
  - platform: wifi_signal
    name: Señal WiFi
    update_interval: 60s
  - platform: uptime
    name: Uptime
    update_interval: 60s
  - platform: internal_temperature
    name: Temperatura interna

text_sensor:
  - platform: wifi_info
    ip_address:
      name: Dirección IP
    ssid:
      name: SSID
  - platform: version
    name: Versión ESPHome

binary_sensor:
  - platform: status
    name: Estado

# Botón para reiniciar la cámara desde HA.
button:
  - platform: restart
    name: Reiniciar
